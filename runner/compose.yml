services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
      args:
        RUNNER_IMAGE: ${RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    image: code-winch-runner:local
    init: true
    restart: unless-stopped
    network_mode: ${NETWORK_MODE:-bridge}
    environment:
      GITHUB_URL: ${GITHUB_URL:?Set GITHUB_URL in runner/.env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-code-winch-local}
      RUNNER_LABELS: ${RUNNER_LABELS:-code-winch,task-scheduler}
    volumes:
      - codex-auth:/home/runner/.codex
      - runner-work:/home/runner/_work
      - scheduler-state:/var/lib/code-winch

  control-panel:
    image: code-winch-runner:local
    init: true
    restart: unless-stopped
    depends_on:
      - runner
    entrypoint:
      - python3
      - /app/control_panel.py
      - --tracker=/var/lib/code-winch/tracker.json
      - --state-file=/var/lib/code-winch/task-state.json
      - --repo-root=/opt/code-winch
      - --host=0.0.0.0
      - --port=8765
    environment:
      CODEX_ENV_ID: ${CODEX_ENV_ID:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8765}:8765"
    volumes:
      - ./control_panel.py:/app/control_panel.py:ro
      - codex-auth:/home/runner/.codex
      - scheduler-state:/var/lib/code-winch

volumes:
  codex-auth:
  runner-work:
  scheduler-state:
