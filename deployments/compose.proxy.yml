name: code-winch-proxy
services:
  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - target: 8080
        published: "${WINCH_PROXY_PORT:-8088}"
        host_ip: 127.0.0.1
        protocol: tcp
    networks: [winch-proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  winch-proxy:
    name: winch-proxy
