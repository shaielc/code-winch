name: code-winch-proxy
services:
  code-winch-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - target: 8080
        published: "${PROXY_PORT:-7080}"
        host_ip: 127.0.0.1
        protocol: tcp
    networks: [proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  proxy:
    name: code-winch-proxy
