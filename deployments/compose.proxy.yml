name: code-winch-proxy
services:
  code-winch-proxy:
    image: traefik:v3.6
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8080"
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: code-winch-proxy
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - target: 8080
        published: "${PROXY_PORT:-7080}"
        host_ip: 127.0.0.1
        protocol: tcp
    networks: [proxy]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  proxy:
    name: code-winch-proxy
