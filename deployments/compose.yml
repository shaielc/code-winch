name: code-winch
services:
  sandbox:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      WINCH_SANDBOX_ADDR: 0.0.0.0:8080
      WINCH_SANDBOX_PROFILE: container-standard
      WINCH_HARNESS_PROFILE: ${WINCH_HARNESS_PROFILE:-fake}
      WINCH_HARNESS_TRANSCRIPT: ${WINCH_HARNESS_TRANSCRIPT:-}
      WINCH_HARNESS_DELAY: ${WINCH_HARNESS_DELAY:-}
      WINCH_HARNESS_FORCE_FAILURE: ${WINCH_HARNESS_FORCE_FAILURE:-}
      WINCH_HARNESS_EARLY_EXIT: ${WINCH_HARNESS_EARLY_EXIT:-}
      WINCH_HARNESS_MALFORMED_LINE: ${WINCH_HARNESS_MALFORMED_LINE:-}
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
  toolchain:
    profiles: [test]
    build:
      context: ..
      dockerfile: deployments/Dockerfile.toolchain
    working_dir: /workspace
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - ..:/workspace
      - go-cache:/go/pkg/mod
    entrypoint: []
volumes:
  go-cache:
