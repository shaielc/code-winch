# Local single-user development stack: browser -> winchd -> postgres.
#
#   docker compose -f deployments/compose.yml up --build
#
# The stack is local-trusted (docs/security.md): the local sandbox driver runs
# harness processes without isolation, and the secrets below are development
# defaults, not credentials. Override them in an untracked
# deployments/compose.override.yml or deployments/.env before exposing this to
# anything but a loopback interface.

name: code-winch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: winch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winch-local-development}
      POSTGRES_DB: winch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The daemon migrates on start, so it must not connect before the
      # database accepts queries on its own socket.
      test: ["CMD-SHELL", "pg_isready -U winch -d winch -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  winchd:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.winchd
    # Harness processes run in this container, so a killed harness can orphan
    # children onto PID 1. The daemon is not an init and never reaps them.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WINCH_ADDR: ":8080"
      WINCH_DATABASE_URL: postgres://winch:${POSTGRES_PASSWORD:-winch-local-development}@postgres:5432/winch?sslmode=disable
      # Must match the origin the browser uses, or every mutating request is
      # rejected as a CSRF failure.
      WINCH_ALLOWED_ORIGIN: ${WINCH_ALLOWED_ORIGIN:-http://localhost:8080}
      # Both secrets must be at least 32 bytes; the API refuses to start
      # otherwise. These are deliberately not secret.
      WINCH_TOKEN: ${WINCH_TOKEN:-local-development-session-token-0000000000}
      WINCH_CSRF_TOKEN: ${WINCH_CSRF_TOKEN:-local-development-csrf-token-000000000000}
      WINCH_ACTOR: ${WINCH_ACTOR:-local-user}
      WINCH_STATIC_DIR: /usr/share/winch/web
    ports:
      - "127.0.0.1:${WINCH_WEB_PORT:-8080}:8080"

  # A long-lived Go and Node toolchain for running the suite without installing
  # either on the host. Dormant unless started with `--profile test`; see
  # deployments/README.md.
  runner:
    profiles: [test]
    build:
      context: ..
      dockerfile: deployments/Dockerfile.winchd
      # The build stage already carries the toolchain and the downloaded module
      # graph; the bind mount below replaces its copy of the source with yours.
      target: build
    # Without an init, `sleep infinity` below is PID 1 and reaps nothing: every
    # orphan the sandbox tests kill stays a zombie, and `kill(pid,0)` still
    # finds it. Also lets `compose stop` terminate the runner promptly.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src
    environment:
      # A database of its own on the same server. The integration helper drops
      # and recreates `public`, so it must never point at `winch`.
      PG_TEST_DATABASE_URL: postgres://winch:${POSTGRES_PASSWORD:-winch-local-development}@postgres:5432/winch_test?sslmode=disable
      GOFLAGS: -mod=readonly
    volumes:
      - ..:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      # The runner is root, so anything it creates under the bind mount above
      # lands root-owned in your working tree. Regenerating a tracked file is
      # safe (the writer truncates in place and ownership survives), but these
      # two directories are created from nothing, so they get volumes instead:
      # the container keeps its own node_modules and its own build output, and
      # a host `make web-build` is never locked out of either. Both outlive
      # test-env-down, so repeat runs reuse them.
      - web-node-modules:/src/web/node_modules
      - web-dist:/src/web/dist
      - npm-cache:/root/.npm
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
  go-mod:
  go-build:
  web-node-modules:
  web-dist:
  npm-cache:
