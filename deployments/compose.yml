name: code-winch
services:
  sandbox:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      WINCH_SANDBOX_ADDR: 0.0.0.0:8080
      WINCH_SANDBOX_PROFILE: container-standard
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
  toolchain:
    profiles: [test]
    build:
      context: ..
      dockerfile: deployments/Dockerfile.toolchain
    working_dir: /workspace
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - ..:/workspace
      - go-cache:/go/pkg/mod
    entrypoint: []
  web:
    profiles: [test]
    image: node:22-alpine
    working_dir: /workspace/web
    volumes:
      - ..:/workspace
      - web-modules:/workspace/web/node_modules
      - npm-cache:/root/.npm
    entrypoint: []
volumes:
  go-cache:
  npm-cache:
  web-modules:
