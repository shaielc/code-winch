services:
  sandbox:
    ports: !reset []
    networks: [test-network, proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WINCH_TEST_PROJECT:?}.rule=Path(`/${WINCH_TEST_PROJECT}/sandbox`) || PathPrefix(`/${WINCH_TEST_PROJECT}/sandbox/`)
      - traefik.http.routers.${WINCH_TEST_PROJECT}.middlewares=${WINCH_TEST_PROJECT}-slash,${WINCH_TEST_PROJECT}-strip
      - traefik.http.middlewares.${WINCH_TEST_PROJECT}-slash.redirectregex.regex=^(https?://[^/]+/${WINCH_TEST_PROJECT}/sandbox)(\?.*)?$$
      - traefik.http.middlewares.${WINCH_TEST_PROJECT}-slash.redirectregex.replacement=$${1}/$${2}
      - traefik.http.middlewares.${WINCH_TEST_PROJECT}-slash.redirectregex.permanent=true
      - traefik.http.middlewares.${WINCH_TEST_PROJECT}-strip.stripprefix.prefixes=/${WINCH_TEST_PROJECT}/sandbox
      - traefik.http.services.${WINCH_TEST_PROJECT}.loadbalancer.server.port=8080
  toolchain:
    networks: [test-network]
    environment:
      WINCH_E2E_URL: http://sandbox:8080
networks:
  test-network: {}
  proxy:
    external: true
    name: code-winch-proxy
