# /main        -> code-winch-sandbox-1            (dev project `code-winch`)
# /test/<name> -> code-winch-test-<name>-sandbox-1 (test project `code-winch-test-<name>`)
# Upstreams are resolved per request through Docker's DNS, so environments can come and
# go without reloading this file. The <name> pattern is a whitelist: without it a request
# could make the proxy connect to any host on the network.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;
    absolute_redirect off;

    proxy_http_version 1.1;
    # The sandbox checks a WebSocket Origin against Host, so Host must stay as the browser sent it.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    error_page 502 504 = @not_running;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /main {
        return 301 /main/;
    }
    location ~ ^/main(?<rest>/.*)$ {
        set $upstream code-winch-sandbox-1;
        proxy_pass http://$upstream:8080$rest$is_args$args;
    }

    location ~ ^/test/(?<envname>[a-z0-9_-]+)$ {
        return 301 /test/$envname/;
    }
    location ~ ^/test/(?<envname>[a-z0-9_-]+)(?<rest>/.*)$ {
        set $upstream code-winch-test-$envname-sandbox-1;
        proxy_pass http://$upstream:8080$rest$is_args$args;
    }

    location @not_running {
        default_type text/plain;
        return 502 "that environment is not running\n";
    }

    location / {
        default_type text/plain;
        return 404 "routes: /main/app and /test/<name>/app\n";
    }
}
