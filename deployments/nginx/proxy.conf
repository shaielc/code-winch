server {
    listen 8080;
    # Docker's embedded DNS, resolved per request so test projects can come and go.
    resolver 127.0.0.11 valid=5s ipv6=off;
    absolute_redirect off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(?<env>[a-z0-9][a-z0-9_-]*)/sandbox$ {
        return 301 /$env/sandbox/;
    }

    location ~ ^/(?<env>[a-z0-9][a-z0-9_-]*)/sandbox(?<rest>/.*)$ {
        proxy_pass http://$env-sandbox-1:8080$rest$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /$env/sandbox;
    }

    location / {
        return 404;
    }
}
