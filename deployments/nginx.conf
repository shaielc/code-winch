# The browser must reach the API on its own origin: the daemon rejects any
# mutating request whose Origin header does not match its configured allowed
# origin, and the session cookie is scoped to /api/v1. Proxying here keeps the
# UI and the API same-origin without widening CORS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI keeps run state in the query string, so unknown paths resolve to
    # the application shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://winchd:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The event stream is a long-lived WebSocket; buffering or a short read
        # timeout would break resumption and swallow heartbeats.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
