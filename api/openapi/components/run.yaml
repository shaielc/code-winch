openapi: 3.0.3
info: { title: Code Winch run schemas, version: 1.0.0 }
paths: {}
components:
  # RunAccepted lives here rather than in the root because it wraps Run, and a
  # root response whose subtree reaches another file makes openapi-typescript
  # mint a second, prefixed component for it. Declared beside the schema it
  # returns, it is one component with one name in both generated outputs.
  responses:
    RunAccepted:
      description: The command was accepted or safely replayed.
      headers:
        ETag: { $ref: "../code-winch.yaml#/components/headers/ETag" }
        Idempotency-Key: { $ref: "../code-winch.yaml#/components/headers/IdempotencyKey" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Run" }
  schemas:
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [workspacePath, harnessProfile, sandboxProfile]
      properties:
        workspacePath: { type: string, minLength: 1, maxLength: 4096, description: Workspace reference; it must not contain credentials. }
        harnessProfile: { type: string, minLength: 1, maxLength: 128 }
        sandboxProfile: { type: string, minLength: 1, maxLength: 128 }
    StopRunRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    Run:
      type: object
      additionalProperties: false
      required: [id, state, version, createdAt, updatedAt, workspacePath, harnessProfile, sandboxProfile]
      properties:
        id: { $ref: "../code-winch.yaml#/components/schemas/RunId" }
        state: { $ref: "../code-winch.yaml#/components/schemas/RunState" }
        version: { type: integer, format: int64, minimum: 1, description: Monotonic concurrency version represented by ETag. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        workspacePath: { type: string }
        harnessProfile: { type: string }
        sandboxProfile: { type: string }
        lastSequence: { type: integer, format: int64, minimum: 0, default: 0 }
