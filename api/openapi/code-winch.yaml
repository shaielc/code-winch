openapi: 3.1.0
info:
  title: Code Winch API
  version: 0.0.0
  description: Public API contract for Code Winch.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health
      responses:
        "200":
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
