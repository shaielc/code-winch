package: httpapi
output: internal/adapters/transport/httpapi/types.gen.go
generate:
  models: true
  chi-server: true
  embedded-spec: true
output-options:
  skip-prune: true
# Every external document resolves into this same Go package, so "-" suppresses
# the import that a real package name would add. The types themselves are not
# emitted here; api-generate-go runs a second models-only pass per components
# file, which is what actually declares them. Both spellings of each path appear
# because the root reaches components/ as ./ and the path files reach it as ../.
import-mapping:
  ../code-winch.yaml: "-"
  ./components/run.yaml: "-"
  ./components/run-input.yaml: "-"
  ./components/event.yaml: "-"
  ./components/health.yaml: "-"
  ../components/run.yaml: "-"
  ../components/run-input.yaml: "-"
  ../components/event.yaml: "-"
  ../components/health.yaml: "-"
