parameters:
  - $ref: "../code-winch.yaml#/components/parameters/RunId"
get:
  operationId: streamRunEvents
  summary: Resume an ordered run event WebSocket stream
  description: |
    Upgrades to WebSocket after header or secure-cookie authentication and
    exact Origin validation. Messages are event, caught_up, heartbeat, or a
    resumable disconnect carrying lastSequence. Authorization is refreshed
    while the connection remains open.
  parameters:
    - name: after_sequence
      in: query
      description: Resume strictly after this durable sequence.
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
  responses:
    "101": { description: WebSocket protocol switch. }
    "400": { $ref: "../code-winch.yaml#/components/responses/ProblemBadRequest" }
    "401": { $ref: "../code-winch.yaml#/components/responses/ProblemUnauthorized" }
    "403": { description: The WebSocket Origin is not allowed. }
    "404": { $ref: "../code-winch.yaml#/components/responses/ProblemRunNotFound" }
