parameters:
  - $ref: "../code-winch.yaml#/components/parameters/RunId"
post:
  operationId: startRun
  summary: Start a created run
  parameters:
    - $ref: "../code-winch.yaml#/components/parameters/IdempotencyKey"
    - $ref: "../code-winch.yaml#/components/parameters/IfMatch"
  responses:
    "202": { $ref: "../components/run.yaml#/components/responses/RunAccepted" }
    "400": { $ref: "../code-winch.yaml#/components/responses/ProblemBadRequest" }
    "401": { $ref: "../code-winch.yaml#/components/responses/ProblemUnauthorized" }
    "404": { $ref: "../code-winch.yaml#/components/responses/ProblemRunNotFound" }
    "409": { $ref: "../code-winch.yaml#/components/responses/ProblemStateConflict" }
    "412": { $ref: "../code-winch.yaml#/components/responses/ProblemPreconditionFailed" }
    "428": { $ref: "../code-winch.yaml#/components/responses/ProblemPreconditionRequired" }
