name: Go quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # make check runs api-check, whose browser half regenerates
      # web/src/api/schema.ts with openapi-typescript. Without these two steps
      # that half exits 127 and CI covers only the generated Go types.
      # Node 22 matches deployments/Dockerfile.winchd and the runner container.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund
        working-directory: web

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run repository checks
        run: make check
