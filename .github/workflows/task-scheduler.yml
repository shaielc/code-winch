name: Schedule available tasks

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: code-winch-task-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: [self-hosted, code-winch, task-scheduler]
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Notify control panel
        env:
          PANEL_URL: ${{ vars.CONTROL_PANEL_URL || 'http://control-panel:8765' }}
          PANEL_TOKEN: ${{ secrets.CONTROL_PANEL_TOKEN }}
        run: |
          test -n "$PANEL_TOKEN"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            endpoint=api/sync
            body='{}'
          else
            endpoint=api/events/merge
            body="@$GITHUB_EVENT_PATH"
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 840 \
            -H "Authorization: Bearer $PANEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$body" "${PANEL_URL%/}/$endpoint"
