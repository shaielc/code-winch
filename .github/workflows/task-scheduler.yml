name: Schedule available tasks

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

concurrency:
  group: code-winch-task-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: [self-hosted, code-winch, task-scheduler]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the merged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Dispatch available tasks
        env:
          CODEX_ENV_ID: ${{ vars.CODEX_ENV_ID }}
        run: |
          test -n "$CODEX_ENV_ID"
          python3 scripts/task_scheduler.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --env "$CODEX_ENV_ID" \
            --state-file /var/lib/code-winch/task-state.json
