name: Task status gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: task-status-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Require a resolvable task
        run: |
          python3 scripts/stamp_task_completion.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --check-only

  stamp:
    if: >-
      github.event_name == 'pull_request_review'
      && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Stamp task completion
        run: |
          python3 scripts/stamp_task_completion.py \
            --event-file "$GITHUB_EVENT_PATH"
